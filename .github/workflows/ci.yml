name: UniCart CI Pipeline

on:
  push:
    branches: [main, master, feat/*]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  lint-test-audit:
    name: Lint, Test, Audit & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Linter (Oxlint)
        run: npm run lint

      - name: Typecheck Server
        run: npm run build --workspace=server

      - name: Typecheck & Build Client (Vite)
        run: npm run build --workspace=client

      - name: Run Server Tests with Coverage
        run: npm run test:coverage --workspace=server
        env:
          NODE_ENV: test
          JWT_ACCESS_SECRET: test_jwt_access_secret_that_is_at_least_32_characters_long
          MONGO_URI: mongodb://localhost:27017/unicart_test
          REDIS_URL: redis://localhost:6379

      - name: Security Vulnerability Audit
        run: npm audit --audit-level=high

  docker-build:
    name: Container Build Verification
    runs-on: ubuntu-latest
    needs: lint-test-audit
    timeout-minutes: 15

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Express API Container
        uses: docker/build-push-action@v5
        with:
          context: ./server
          file: ./server/Dockerfile
          push: false
          tags: unicart/api:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build BullMQ Worker Container
        uses: docker/build-push-action@v5
        with:
          context: ./server
          file: ./server/Dockerfile.worker
          push: false
          tags: unicart/worker:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validate Docker Compose Configuration
        run: docker compose config
