services:
  # MongoDB 7.0 Single-Node Replica Set (enables transactions required for checkout)
  mongo:
    image: mongo:7.0
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"try { rs.status().ok } catch(e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}).ok }\" || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  # Redis 7.2 Cache & Rate Limiting & Queue store
  redis:
    image: redis:7.2-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 3s
    restart: unless-stopped

  # Stateless Express API (Horizontally Scalable: docker compose up --scale api=3)
  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=production
      - PORT=5000
      - CLIENT_ORIGINS=http://localhost,http://localhost:80,http://localhost:5173
      - MONGO_URI=mongodb://mongo:27017/unicart?replicaSet=rs0
      - MONGO_POOL_SIZE=50
      - REDIS_URL=redis://redis:6379
      - JWT_ACCESS_SECRET=production_secret_key_at_least_32_characters_long_for_security
      - JWT_ACCESS_TTL=15m
      - REFRESH_TOKEN_TTL_DAYS=7
      - COOKIE_SECURE=false
      - LOG_LEVEL=info
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Background Queue Consumer (BullMQ Worker)
  worker:
    build:
      context: ./server
      dockerfile: Dockerfile.worker
    environment:
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongo:27017/unicart?replicaSet=rs0
      - REDIS_URL=redis://redis:6379
      - JWT_ACCESS_SECRET=production_secret_key_at_least_32_characters_long_for_security
      - LOG_LEVEL=info
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Nginx Load Balancer, SSL termination, Rate Limiter & Reverse Proxy
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./client/dist:/usr/share/nginx/html:ro
    depends_on:
      - api
    restart: unless-stopped

volumes:
  mongo_data:
  redis_data:
